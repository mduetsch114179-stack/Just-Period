<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f9edf0"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Log Period"><link rel="apple-touch-icon" href="log-icon.png"><title>Log Period · Just Period</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f9edf0;color:#503942}*{box-sizing:border-box}body{margin:0}main{max-width:480px;margin:auto;padding:calc(40px + env(safe-area-inset-top)) 22px 36px}h1{font-size:30px}p{line-height:1.5}.card{background:white;padding:23px;border-radius:22px;margin-top:25px}button{display:block;width:100%;border:0;border-radius:14px;padding:16px;margin:12px 0;font:inherit;font-weight:700;background:#a94e70;color:white}button.secondary{background:#edd8df;color:#503942}button:disabled{opacity:.45}a{color:#8b3d5d}label{display:block;margin-top:16px}input{font:inherit;padding:12px;width:100%;border:1px solid #d8b9c6;border-radius:10px;margin-top:6px}small{color:#826775}#status{min-height:24px;color:#8b3d5d}input[type=date]{height:48px;min-height:48px;max-width:100%;font-size:16px;color-scheme:light}input[type=date]::-webkit-date-and-time-value{text-align:left}@media(prefers-color-scheme:dark){input[type=date]{color-scheme:dark}}</style></head><body><main><a href="./index.html">← Just Period</a><h1>Log Period<span style="color:#b65d7e">.</span></h1><p>Quickly record a start or end date. Saved only on this device.</p><section class="card"><label for="date">Date</label><input type="date" id="date"><button id="start">Start period</button><button id="end" class="secondary">End period</button><p id="status" role="status"></p><small>Use the same Safari website as Just Period to share your existing history.</small></section></main><script>(()=>{'use strict';const KEY='just-period-v1',el=id=>document.getElementById(id),today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};el('date').value=today();let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.periods))data={periods:[],cycle:28,duration:5};const status=s=>el('status').textContent=s;const valid=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T12:00:00').getTime());function refresh(){el('end').disabled=!data.periods.some(p=>!p.end&&!p.cycleOnly)}function save(){try{localStorage.setItem(KEY,JSON.stringify(data));refresh();return true}catch{status('Could not save. Check your device storage.');return false}}el('start').onclick=()=>{const date=el('date').value;if(!valid(date))return status('Choose a valid date.');if(data.periods.some(p=>!p.end&&!p.cycleOnly))return status('End your current period before starting another.');if(data.periods.some(p=>p.start===date))return status('A period already starts on this date.');data.periods.push({start:date,end:'',flow:''});data.periods.sort((a,b)=>a.start.localeCompare(b.start));if(save())status('Period started on '+date+'.')};el('end').onclick=()=>{const date=el('date').value;const open=[...data.periods].reverse().find(p=>!p.end&&!p.cycleOnly);if(!open)return status('No ongoing period to end.');if(!valid(date)||date<open.start)return status('End date must be on or after '+open.start+'.');const duration=Math.round((new Date(date+'T12:00:00')-new Date(open.start+'T12:00:00'))/86400000)+1;if(duration>15)return status('Choose an end date within 15 days of the start.');open.end=date;if(save())status('Period ended on '+date+'.')};refresh();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{})})();</script></body></html>
